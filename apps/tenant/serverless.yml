# Per-tenant application stack.
#
# Deployed once per tenant by scripts/deploy-tenant.js (run inside the tenant's
# CodeBuild project) after the tenant has registered and saved a payment method.
# This is a minimal placeholder: it shows what a tenant gets once provisioned
# (its own API on a custom domain, with access to its own tenant-scoped tables
# created by the ten-resources stack). The real tenant application is not part
# of this repository.

org: tueloper
app: tenant-provisioning-service
service: tenant
frameworkVersion: "4"

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${env:STAGE, 'dev'}
  region: ${env:AWS_REGION, 'ca-central-1'}
  memorySize: 256
  timeout: 30
  logRetentionInDays: 7
  versionFunctions: false
  stackName: "${self:provider.stage}-${self:service}"
  deploymentBucket:
    name: s3-${self:provider.stage}-${env:TENANT_ID}-${self:provider.region}.${env:ACCOUNT_ID}.deploys.${self:service}
  environment:
    STAGE: ${self:provider.stage}
    REGION: ${self:provider.region}
    TENANT_ID: ${env:TENANT_ID}
    AWS_NODEJS_CONNECTION_REUSE_ENABLED: 1
  stackTags:
    SERVICE: "${self:service}"
    TENANT_ID: "${env:TENANT_ID}"
  iam:
    role:
      statements:
        # Only this tenant's tables (created by the ten-resources stack)
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
          Resource:
            - "arn:aws:dynamodb:${self:provider.region}:${env:ACCOUNT_ID}:table/${self:provider.stage}-ten-resources-${env:TENANT_ID}-*"

plugins:
  - serverless-domain-manager
  - serverless-offline

custom:
  # Each tenant's API is served under the shared custom domain at its own base path.
  # deploy-tenant.js runs `sls create_domain` for this stack before deploying.
  customDomain:
    domainName: ${env:AWS_CUSTOM_DOMAIN}
    stage: ${self:provider.stage}
    basePath: ${self:provider.stackName}
    certificateName: ${env:AWS_CUSTOM_DOMAIN}
    createRoute53Record: true
  serverless-offline:
    httpPort: 2001
    lambdaPort: 2003

functions:
  health:
    handler: src/health.handler
    description: Confirms the tenant stack is deployed and reports which tenant it serves
    events:
      - http:
          path: /health
          method: get
          cors: true
