# Platform-wide resources shared by every tenant: the tenant registry,
# onboarding progress, and the provisioning queues.

org: tueloper
app: tenant-provisioning-service
service: shared-resources
frameworkVersion: "4"

provider:
  name: aws
  region: ${env:AWS_REGION, 'ca-central-1'}
  stage: ${env:STAGE, 'dev'}
  stackName: "${self:provider.stage}-${self:service}"
  deploymentBucket:
    name: s3-${self:provider.stage}-${self:provider.region}.${env:ACCOUNT_ID}.deploys.${self:service}
  stackTags:
    SERVICE: "${self:service}"

resources:
  Resources:
    # One record per tenant: signup details, verification, payment and provisioning status
    TenantTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.stackName}-tenant
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: tenantUUID
            AttributeType: S
          - AttributeName: tenantId
            AttributeType: S
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: tenantUUID
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: TenantIdIndex
            KeySchema:
              - AttributeName: tenantId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: TenantEmailIndex
            KeySchema:
              - AttributeName: email
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    # Each tenant's onboarding wizard progress, created after provisioning
    SetupWizardTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.stackName}-setup-wizard
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: tenantId
            AttributeType: S
        KeySchema:
          - AttributeName: tenantId
            KeyType: HASH
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # Tenants whose payment is confirmed and who are waiting to be provisioned
    TenantQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:provider.stackName}-tenant-queue
        VisibilityTimeout: 120

    # Messages from a tenant's build once its stacks are deployed
    PostDeploymentQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:provider.stackName}-post-deployment-queue
        VisibilityTimeout: 120
