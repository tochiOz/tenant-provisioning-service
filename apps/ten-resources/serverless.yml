org: tueloper
app: tenant-provisioning-service
service: ten-resources
frameworkVersion: "4"

provider:
  name: aws
  region: ${env:AWS_REGION, 'ca-central-1'}
  stage: ${env:STAGE, 'dev'}
  stackName: "${self:provider.stage}-${self:service}"
  deploymentBucket:
    name: s3-${self:provider.stage}-${env:TENANT_ID}-${self:provider.region}.${env:ACCOUNT_ID}.deploys.${self:service}
  stackTags:
    SERVICE: "${self:service}"
    TENANT_ID: "${env:TENANT_ID}"

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.stackName}-${env:TENANT_ID}-users
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: UserEmailIndex
            KeySchema:
              - AttributeName: email
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
